<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Calculator</title>
</head>
<body>
    <div class="calculatorContainer">
        <div class="screen">

        </div>
        <div class="buttonContainer">
            <div class="numbersContainer">
                <!--added in rows as visualized in the screen later-->
                <button data-number="7">7</button>
                <button data-number="8">8</button>
                <button data-number="9">9</button>

                <button data-number="4">4</button>
                <button data-number="5">5</button>
                <button data-number="6">6</button>

                <button data-number="1">1</button>
                <button data-number="2">2</button>
                <button data-number="3">3</button>

                <button data-number="0">0</button>
            </div>
            <div class="operatorContainer">
                <!--Operator and action buttons-->
                <button data-action="equals">=</button>
                <button data-action="clear">clear</button>
                <button data-action="backspace">backspace</button>

                <button data-operator="+">+</button>
                <button data-operator="-">-</button>
                <button data-operator="*">x</button>
                <button data-operator="/">/</button>
            </div>
        </div>
    </div>
    <script src="myscripts.js"></script>
</body>
</html>
